<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VAPEhyz shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0a;
            --text: #ffffff;
            --hint: #aaa;
            --secondary: #161616;
            --green: #00d4ff;
            --red: #ff6b6b;
            --radius: 14px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 80px 16px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* ===== БЫСТРОЕ ПЕРЕЛИВАНИЕ ФОНА ===== */
        .live-bg {
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(0, 180, 255, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 20%, rgba(120, 0, 255, 0.30) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 0, 150, 0.28) 0%, transparent 45%),
                radial-gradient(ellipse at 10% 70%, rgba(0, 255, 200, 0.26) 0%, transparent 40%),
                radial-gradient(ellipse at 90% 60%, rgba(255, 100, 0, 0.24) 0%, transparent 40%),
                radial-gradient(ellipse at 30% 90%, rgba(0, 200, 255, 0.30) 0%, transparent 35%),
                radial-gradient(ellipse at 80% 10%, rgba(200, 0, 255, 0.26) 0%, transparent 35%),
                radial-gradient(ellipse at 40% 40%, rgba(0, 255, 220, 0.24) 0%, transparent 30%),
                radial-gradient(ellipse at 60% 70%, rgba(255, 0, 200, 0.22) 0%, transparent 30%);
            background-size: 200% 200%;
            animation: bgMove 3s ease-in-out infinite alternate;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.9;
        }
        
        @keyframes bgMove {
            0% { transform: scale(1) rotate(0deg) translate(0%, 0%); }
            25% { transform: scale(1.1) rotate(3deg) translate(5%, -3%); }
            50% { transform: scale(1.15) rotate(-4deg) translate(-5%, 5%); }
            75% { transform: scale(1.1) rotate(4deg) translate(3%, -5%); }
            100% { transform: scale(1) rotate(-2deg) translate(-3%, 3%); }
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc, #ff6bcd, #00d4ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header p { font-size: 12px; color: var(--hint); }
        
        .cart-icon {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            background: rgba(20,20,20,0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: transform .3s ease;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0,0,0,.5);
        }
        .cart-icon:active { transform: scale(.9); }
        .cart-icon .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff6b6b;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg);
        }
        .cart-icon .badge.hidden { display: none; }
        
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }
        .search-box {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,.06);
            background: rgba(255,255,255,.04);
            color: var(--text);
            font-size: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all .3s ease;
        }
        .search-box:focus {
            outline: none;
            border-color: rgba(0, 180, 255, .3);
            background: rgba(255,255,255,.06);
        }
        .search-box::placeholder { color: var(--hint); }
        
        .sort-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,.06);
            background: rgba(255,255,255,.04);
            color: var(--text);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s ease;
            white-space: nowrap;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .sort-btn:active { transform: scale(.95); }
        .sort-btn.active {
            background: rgba(0, 180, 255, .2);
            border-color: rgba(0, 180, 255, .3);
            color: #00d4ff;
        }
        .sort-group { display: flex; gap: 6px; flex-wrap: wrap; }
        
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 12px;
            margin-bottom: 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            position: relative;
            z-index: 1;
        }
        .categories::-webkit-scrollbar { display: none; }
        
        .category-btn {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,.06);
            background: rgba(255,255,255,.04);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s ease;
            white-space: nowrap;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .category-btn:active { transform: scale(.95); }
        .category-btn.active {
            background: rgba(0, 180, 255, .2);
            border-color: rgba(0, 180, 255, .3);
            color: #00d4ff;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        
        .product-card {
            background: rgba(255,255,255,.04);
            border-radius: var(--radius);
            padding: 12px;
            border: 1px solid rgba(255,255,255,.06);
            transition: all .3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            animation: fadeIn .4s ease;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .product-card:active {
            transform: scale(.97);
            border-color: rgba(0, 180, 255, .3);
        }
        
        .product-card .image {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(255,255,255,.03);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,.05);
            overflow: hidden;
            position: relative;
        }
        .product-card .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .product-card .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #00d4ff;
            color: #000;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .product-card .badge.sold-out { background: #ff6b6b; color: #fff; }
        
        .product-card .name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
            min-height: 36px;
        }
        .product-card .description {
            font-size: 12px;
            color: var(--hint);
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 32px;
        }
        .product-card .price {
            font-size: 17px;
            font-weight: 700;
            color: #00d4ff;
            margin-top: auto;
        }
        .product-card .variants-count {
            font-size: 11px;
            color: var(--hint);
            margin-top: 4px;
        }
        
        .empty {
            text-align: center;
            padding: 60px 0;
            color: var(--hint);
            font-size: 16px;
            grid-column: 1 / -1;
        }
        
        .orders-section {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,.05);
            position: relative;
            z-index: 1;
        }
        .orders-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--hint);
        }
        .order-item {
            background: rgba(255,255,255,.03);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .order-item .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-item .order-id {
            font-size: 12px;
            color: var(--hint);
        }
        .order-item .order-status {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .order-item .order-status.new { background: rgba(0, 180, 255, .2); color: #00d4ff; }
        .order-item .order-status.confirmed { background: rgba(0, 255, 200, .2); color: #00ffc8; }
        .order-item .order-status.delivered { background: rgba(120, 0, 255, .2); color: #7b2ffc; }
        .order-item .order-status.cancelled { background: rgba(255, 107, 107, .2); color: #ff6b6b; }
        .order-item .order-items {
            font-size: 12px;
            color: var(--hint);
            margin: 4px 0;
        }
        .order-item .order-total {
            font-size: 15px;
            font-weight: 700;
            color: #00d4ff;
        }
        .order-item .order-date {
            font-size: 11px;
            color: var(--hint);
        }
        .order-item .cancel-btn {
            margin-top: 8px;
            padding: 6px 16px;
            background: #ff6b6b;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            width: 100%;
        }
        .order-item .cancel-btn:active { transform: scale(.95); }
        .order-item .cancel-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        
        #productModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.92);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: 100;
            padding: 16px;
            overflow-y: auto;
            animation: fadeIn .3s ease;
        }
        #productModal .modal-content {
            max-width: 420px;
            margin: 20px auto;
            background: rgba(20,20,20,.95);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid rgba(255,255,255,.08);
            position: relative;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 60px rgba(0,0,0,.6);
        }
        #productModal .modal-close {
            position: absolute;
            top: -16px;
            right: -16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(30,30,30,.95);
            border: 2px solid rgba(255,255,255,.15);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .3s ease;
            z-index: 10;
        }
        #productModal .modal-close:active {
            transform: scale(.85);
            background: rgba(255,107,107,.3);
            border-color: rgba(255,107,107,.3);
        }
        #productModal .modal-image {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(255,255,255,.03);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,.05);
        }
        #productModal .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #productModal .modal-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        #productModal .modal-category {
            font-size: 13px;
            color: var(--hint);
            margin-bottom: 8px;
        }
        #productModal .modal-description {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
            padding: 12px;
            background: rgba(255,255,255,.03);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.05);
        }
        #productModal .modal-price {
            font-size: 22px;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 12px;
        }
        #productModal .variants-title {
            font-size: 14px;
            font-weight: 600;
            color: #ff6bcd;
            margin: 12px 0 8px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,.05);
        }
        #productModal .variant-btn {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,.05);
            border-radius: 10px;
            background: rgba(255,255,255,.03);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #productModal .variant-btn:active { transform: scale(.97); }
        #productModal .variant-btn.active {
            border-color: rgba(0, 180, 255, .4);
            background: rgba(0, 180, 255, .08);
        }
        #productModal .variant-btn .variant-price {
            color: #00d4ff;
            font-weight: 700;
        }
        #productModal .no-variants {
            color: var(--hint);
            font-size: 14px;
            padding: 8px 0;
        }
        #productModal .modal-add-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            margin-top: 12px;
        }
        #productModal .modal-add-btn:active { transform: scale(.96); }
        #productModal .modal-add-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        #productModal .modal-bottom-close {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,.06);
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all .2s;
            border: 1px solid rgba(255,255,255,.06);
        }
        #productModal .modal-bottom-close:active {
            transform: scale(.96);
            background: rgba(255,255,255,.1);
        }
        
        #cartModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.92);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: 200;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn .3s ease;
        }
        #cartModal .modal-content {
            max-width: 420px;
            margin: 20px auto;
            background: rgba(20,20,20,.95);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid rgba(255,255,255,.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        #cartModal h2 { font-size: 20px; margin-bottom: 16px; }
        #cartModal .cart-total {
            font-size: 20px;
            font-weight: 700;
            margin: 16px 0;
            text-align: right;
        }
        #cartModal .cart-total span { color: #00d4ff; }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .cart-item .item-details { flex: 1; margin-right: 10px; }
        .cart-item .item-details strong { display: block; font-size: 14px; }
        .cart-item .item-details small { color: var(--hint); font-size: 11px; }
        .cart-item .item-price { color: #00d4ff; font-weight: 600; font-size: 14px; margin-right: 10px; }
        .cart-item .remove-btn {
            background: #ff6b6b;
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all .2s;
        }
        .cart-item .remove-btn:active { transform: scale(.9); }
        
        .cart-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .cart-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }
        .cart-actions button:active { transform: scale(.96); }
        .cart-actions .clear-btn { background: #ff6b6b; color: #fff; }
        .cart-actions .close-btn { background: rgba(255,255,255,.04); color: #fff; }
        .cart-actions .checkout-btn { background: linear-gradient(135deg, #00d4ff, #7b2ffc); color: #fff; }
        .cart-actions .checkout-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        .empty-cart {
            text-align: center;
            padding: 40px 0;
            color: var(--hint);
        }
        
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,20,20,.92);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,.05);
            z-index: 300;
            animation: fadeIn .3s ease;
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        @media (min-width: 500px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); }
            .top-bar { flex-wrap: nowrap; }
        }
        @media (max-width: 360px) {
            .products-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .product-card { padding: 8px; }
            .product-card .name { font-size: 12px; min-height: 30px; }
            .product-card .description { font-size: 11px; min-height: 26px; }
            .header h1 { font-size: 18px; }
            .cart-icon { width: 44px; height: 44px; font-size: 18px; top: 12px; right: 12px; }
            #productModal .modal-close { top: -12px; right: -12px; width: 38px; height: 38px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="live-bg"></div>
    
    <div class="header">
        <div><h1>💨 VAPEhyz shop</h1><p>Эксклюзивные девайсы и жидкости</p></div>
    </div>
    
    <div class="cart-icon" id="cartIcon">
        🛒
        <span class="badge hidden" id="cartBadge">0</span>
    </div>
    
    <div class="top-bar">
        <input class="search-box" id="searchInput" placeholder="🔍 Поиск товаров...">
        <div class="sort-group">
            <button class="sort-btn active" data-sort="popular">🔥 Популярные</button>
            <button class="sort-btn" data-sort="price_asc">💰 ↑</button>
            <button class="sort-btn" data-sort="price_desc">💰 ↓</button>
        </div>
    </div>
    
    <div class="categories" id="categories">
        <button class="category-btn active" data-category="all">Все</button>
        <button class="category-btn" data-category="ПОД-системы">ПОД-системы</button>
        <button class="category-btn" data-category="Жидкости">Жидкости</button>
        <button class="category-btn" data-category="Картриджи">Картриджи</button>
        <button class="category-btn" data-category="HQD">HQD</button>
    </div>
    
    <div class="products-grid" id="productsGrid">
        <div class="empty">Загрузка товаров...</div>
    </div>
    
    <div class="orders-section" id="ordersSection">
        <div class="orders-title">📋 Мои заказы</div>
        <div id="ordersList"></div>
    </div>
    
    <div id="productModal">
        <div class="modal-content">
            <button class="modal-close" id="closeProductBtn">✕</button>
            <div class="modal-image"><img id="modalImg" src="" alt=""></div>
            <div class="modal-name" id="modalName">Название</div>
            <div class="modal-category" id="modalCategory">Категория</div>
            <div class="modal-description" id="modalDescription">Описание</div>
            <div class="modal-price" id="modalPrice">0 ₽</div>
            <div class="variants-title">📌 Варианты:</div>
            <div id="modalVariants"></div>
            <button class="modal-add-btn" id="modalAddBtn">🛒 В корзину</button>
            <button class="modal-bottom-close" id="closeProductBottomBtn">Закрыть</button>
        </div>
    </div>
    
    <div id="cartModal">
        <div class="modal-content">
            <h2>🛒 Корзина</h2>
            <div id="cartItems"></div>
            <div class="cart-total">Итого: <span id="modalTotal">0 ₽</span></div>
            <div class="cart-actions">
                <button class="clear-btn" id="clearCartBtn">🗑️</button>
                <button class="close-btn" id="closeCartBtn">Закрыть</button>
                <button class="checkout-btn" id="checkoutBtn">Оформить</button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            
            const $ = id => document.getElementById(id);
            const grid = $('productsGrid');
            const cartBadge = $('cartBadge');
            const cartIcon = $('cartIcon');
            
            let products = [];
            let cart = [];
            let currentCategory = 'all';
            let currentSort = 'popular';
            let searchQuery = '';
            let selectedProduct = null;
            let selectedVariant = null;
            let userOrders = [];
            
            function saveCart() {
                try { localStorage.setItem('vape_cart', JSON.stringify(cart)); } catch {}
            }
            
            function loadCart() {
                try {
                    const saved = localStorage.getItem('vape_cart');
                    if (saved) { cart = JSON.parse(saved); updateCartUI(); }
                } catch {}
            }
            
            function updateCartUI() {
                const count = cart.reduce((s, i) => s + i.quantity, 0);
                if (count > 0) {
                    cartBadge.textContent = count;
                    cartBadge.classList.remove('hidden');
                    cartIcon.style.transform = 'scale(1.1)';
                    setTimeout(() => cartIcon.style.transform = 'scale(1)', 200);
                } else {
                    cartBadge.classList.add('hidden');
                }
                saveCart();
            }
            
            function addToCart(productToAdd) {
                if (!productToAdd.available) {
                    tg.showAlert('❌ Товар временно недоступен');
                    return;
                }
                const existing = cart.find(i => i.id === productToAdd.id && i.name === productToAdd.name);
                if (existing) { existing.quantity += 1; }
                else { cart.push({ ...productToAdd, quantity: 1 }); }
                updateCartUI();
                tg.HapticFeedback.impactOccurred('light');
                showToast(`✅ ${productToAdd.name} добавлен в корзину`);
            }
            
            function removeFromCart(productId) {
                cart = cart.filter(i => i.id !== productId);
                updateCartUI();
                renderCart();
            }
            
            function clearCart() {
                if (!cart.length) return;
                cart = [];
                updateCartUI();
                renderCart();
                showToast('🗑️ Корзина очищена');
            }
            
            async function loadProducts() {
                try {
                    const res = await fetch(`/api/products?sort=${currentSort}`);
                    if (!res.ok) throw new Error('Ошибка загрузки');
                    products = await res.json();
                    applyFilters();
                } catch {
                    grid.innerHTML = `<div class="empty">❌ Ошибка загрузки</div>`;
                }
            }
            
            // ================= 🔥 ГЛАВНАЯ ФУНКЦИЯ =================
            function applyFilters() {
                let result = [...products];
                const q = searchQuery.trim().toLowerCase();
                if (q) result = result.filter(p => p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q));
                if (currentCategory !== 'all') result = result.filter(p => p.category === currentCategory);
                
                // 🔥 БЕРЁМ ТОВАРЫ ТАК, КАК ИХ ОТДАЁТ API
                // У каждого товара уже есть поле "variants" и "has_variants"
                renderProducts(result);
            }
            
            function renderProducts(items) {
                if (!items.length) {
                    grid.innerHTML = `<div class="empty">😕 Ничего не найдено</div>`;
                    return;
                }
                
                grid.innerHTML = items.map(p => {
                    const hasVariants = p.has_variants || (p.variants && p.variants.length > 0);
                    const variantsCount = p.variants ? p.variants.length : 0;
                    
                    return `
                        <div class="product-card" data-id="${p.id}">
                            <div class="image">
                                ${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/1a1a1a/ffffff?text=${encodeURIComponent(p.name)}'">` : '📦'}
                                ${!p.available ? '<span class="badge sold-out">Нет</span>' : '<span class="badge">В наличии</span>'}
                            </div>
                            <div class="name">${p.name}</div>
                            <div class="description">${p.description || ''}</div>
                            <div class="price">${hasVariants ? `от ${p.price} ₽` : `${p.price} ₽`}</div>
                            ${hasVariants ? `<div class="variants-count">📌 ${variantsCount} вариантов</div>` : ''}
                        </div>
                    `;
                }).join('');
                
                document.querySelectorAll('.product-card').forEach(el => {
                    el.addEventListener('click', () => openProductModal(+el.dataset.id));
                });
            }
            
            function openProductModal(productId) {
                const product = products.find(p => p.id === productId);
                if (!product) return;
                
                // 🔥 Берём варианты прямо из товара
                const variants = product.variants || [];
                
                selectedProduct = {
                    ...product,
                    variants: variants.map(v => ({
                        name: v.name,
                        price: v.price,
                        fullName: `${product.name} — ${v.name}`
                    }))
                };
                
                if (selectedProduct.variants.length === 0) {
                    selectedProduct.variants = [{ name: 'Стандарт', price: selectedProduct.price, fullName: selectedProduct.name }];
                }
                selectedVariant = null;
                
                $('modalImg').src = product.image || 'https://via.placeholder.com/300x300/1a1a1a/ffffff?text=Нет+фото';
                $('modalImg').alt = product.name;
                $('modalCategory').textContent = product.category;
                $('modalDescription').textContent = product.description || 'Описание отсутствует';
                
                const defaultVariant = selectedProduct.variants[0];
                $('modalName').textContent = selectedProduct.name;
                $('modalPrice').textContent = `${defaultVariant.price} ₽`;
                
                const container = $('modalVariants');
                const variantsList = selectedProduct.variants;
                
                if (!variantsList.length || (variantsList.length === 1 && variantsList[0].name === 'Стандарт')) {
                    container.innerHTML = '<div class="no-variants">Нет вариантов</div>';
                    $('modalAddBtn').disabled = false;
                    $('modalAddBtn').textContent = '🛒 В корзину';
                } else {
                    container.innerHTML = variantsList.map((v, idx) => `
                        <button class="variant-btn" data-idx="${idx}">
                            <span>${v.name}</span>
                            <span class="variant-price">${v.price} ₽</span>
                        </button>
                    `).join('');
                    container.querySelectorAll('.variant-btn').forEach(btn => {
                        btn.addEventListener('click', () => selectVariant(+btn.dataset.idx));
                    });
                    selectVariant(0);
                }
                
                $('productModal').style.display = 'block';
                tg.HapticFeedback.impactOccurred('light');
            }
            
            function selectVariant(index) {
                selectedVariant = index;
                document.querySelectorAll('#modalVariants .variant-btn').forEach((btn, i) => {
                    btn.classList.toggle('active', i === index);
                });
                const variant = selectedProduct.variants[index];
                $('modalName').textContent = `${selectedProduct.name} — ${variant.name}`;
                $('modalPrice').textContent = `${variant.price} ₽`;
                $('modalAddBtn').disabled = false;
                $('modalAddBtn').textContent = `🛒 ${variant.name} — ${variant.price} ₽`;
            }
            
            function addSelectedVariant() {
                if (!selectedProduct) return;
                let productToAdd;
                if (selectedProduct.variants && selectedProduct.variants.length > 0 && selectedVariant !== null) {
                    const variant = selectedProduct.variants[selectedVariant];
                    productToAdd = {
                        ...selectedProduct,
                        name: `${selectedProduct.name} — ${variant.name}`,
                        price: variant.price,
                        is_variant: true,
                        parent_id: selectedProduct.id
                    };
                } else {
                    productToAdd = { ...selectedProduct };
                }
                addToCart(productToAdd);
                closeProductModal();
            }
            
            function closeProductModal() {
                $('productModal').style.display = 'none';
                selectedProduct = null;
                selectedVariant = null;
            }
            
            function renderCart() {
                const container = $('cartItems');
                if (!cart.length) {
                    container.innerHTML = '<div class="empty-cart">🛒 Корзина пуста</div>';
                    $('modalTotal').textContent = '0 ₽';
                    $('checkoutBtn').disabled = true;
                    return;
                }
                container.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="item-details">
                            <strong>${item.name}</strong>
                            <small>${item.description || ''}</small>
                        </div>
                        <div class="item-price">${item.price * item.quantity} ₽</div>
                        <button class="remove-btn" data-id="${item.id}">✕</button>
                    </div>
                `).join('');
                container.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', () => removeFromCart(+btn.dataset.id));
                });
                const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
                $('modalTotal').textContent = `${total} ₽`;
                $('checkoutBtn').disabled = false;
            }
            
            function showCart() {
                renderCart();
                $('cartModal').style.display = 'block';
            }
            function closeCart() { $('cartModal').style.display = 'none'; }
            
            async function checkout() {
                if (!cart.length) return;
                const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
                const user = tg.initDataUnsafe?.user || {};
                const btn = $('checkoutBtn');
                btn.disabled = true;
                btn.textContent = '⏳...';
                try {
                    const res = await fetch('/api/order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: user.id || 0,
                            user_name: user.first_name || 'Пользователь',
                            username: user.username || '',
                            items: cart,
                            total
                        })
                    });
                    const result = await res.json();
                    if (result.status === 'success') {
                        tg.showAlert('✅ Заказ оформлен!');
                        cart = [];
                        saveCart();
                        updateCartUI();
                        closeCart();
                        loadUserOrders();
                    } else {
                        tg.showAlert('❌ Ошибка');
                    }
                } catch {
                    tg.showAlert('❌ Ошибка соединения');
                }
                btn.disabled = false;
                btn.textContent = 'Оформить';
            }
            
            async function loadUserOrders() {
                try {
                    const user = tg.initDataUnsafe?.user || {};
                    const res = await fetch('/api/user_orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: user.id || 0 })
                    });
                    const data = await res.json();
                    userOrders = data.orders || [];
                    renderOrders(userOrders);
                } catch (e) { console.error('Ошибка загрузки заказов:', e); }
            }
            
            function renderOrders(orders) {
                const container = $('ordersList');
                if (!orders || !orders.length) {
                    container.innerHTML = '<div style="text-align:center;padding:12px 0;color:var(--hint);font-size:13px;">У вас пока нет заказов</div>';
                    return;
                }
                container.innerHTML = orders.map(order => {
                    const statusMap = { 'Новый': 'new', 'Подтверждён': 'confirmed', 'Доставлен': 'delivered', 'Отменён': 'cancelled' };
                    const statusClass = statusMap[order.status] || 'new';
                    const canCancel = order.status === 'Новый' || order.status === 'Подтверждён';
                    return `
                        <div class="order-item">
                            <div class="order-header">
                                <span class="order-id">Заказ #${order.id}</span>
                                <span class="order-status ${statusClass}">${order.status || 'Новый'}</span>
                            </div>
                            <div class="order-items">${order.items.map(i => `${i.name} x${i.quantity}`).join(', ')}</div>
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
                                <span class="order-total">${order.total} ₽</span>
                                <span class="order-date">${order.created_at ? order.created_at.replace('T', ' ').slice(0, 16) : ''}</span>
                            </div>
                            ${canCancel ? `<button class="cancel-btn" data-id="${order.id}">❌ Отменить заказ</button>` : ''}
                        </div>
                    `;
                }).join('');
                
                document.querySelectorAll('.cancel-btn').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const orderId = parseInt(this.dataset.id);
                        if (!confirm('❌ Вы уверены, что хотите отменить заказ #' + orderId + '?')) return;
                        this.disabled = true;
                        this.textContent = '⏳ Отмена...';
                        try {
                            const user = tg.initDataUnsafe?.user || {};
                            const res = await fetch('/api/cancel_order', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ order_id: orderId, user_id: user.id || 0 })
                            });
                            const result = await res.json();
                            if (result.status === 'success') {
                                tg.showAlert('✅ Заказ #' + orderId + ' отменён!');
                                loadUserOrders();
                                tg.HapticFeedback.impactOccurred('light');
                            } else {
                                tg.showAlert('❌ ' + (result.message || 'Ошибка отмены заказа'));
                                this.disabled = false;
                                this.textContent = '❌ Отменить заказ';
                            }
                        } catch (e) {
                            tg.showAlert('❌ Ошибка соединения');
                            this.disabled = false;
                            this.textContent = '❌ Отменить заказ';
                        }
                    });
                });
            }
            
            function showToast(message) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }
            
            document.addEventListener('DOMContentLoaded', () => {
                loadCart();
                loadProducts();
                loadUserOrders();
            });
            
            $('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFilters();
            });
            
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSort = btn.dataset.sort;
                    loadProducts();
                    tg.HapticFeedback.impactOccurred('light');
                });
            });
            
            $('categories').addEventListener('click', (e) => {
                const btn = e.target.closest('.category-btn');
                if (!btn) return;
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                applyFilters();
                tg.HapticFeedback.impactOccurred('light');
            });
            
            cartIcon.addEventListener('click', showCart);
            $('clearCartBtn').addEventListener('click', clearCart);
            $('closeCartBtn').addEventListener('click', closeCart);
            $('checkoutBtn').addEventListener('click', checkout);
            $('cartModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeCart(); });
            
            $('modalAddBtn').addEventListener('click', addSelectedVariant);
            $('closeProductBtn').addEventListener('click', closeProductModal);
            $('closeProductBottomBtn').addEventListener('click', closeProductModal);
            $('productModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeProductModal(); });
            
            tg.BackButton.onClick(() => tg.close());
            
            window.addEventListener('beforeunload', saveCart);
            document.addEventListener('visibilitychange', () => { if (document.hidden) saveCart(); });
        })();
    </script>
</body>
</html>
